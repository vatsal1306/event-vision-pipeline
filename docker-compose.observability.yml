# Merge only — never start this file by itself:
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Starting prod compose without this file silently drops Alloy.

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    mem_limit: 256m
    command:
      - --docker_only=true
      - --store_container_labels=true
      - --housekeeping_interval=60s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    env_file: .env
    mem_limit: 512m
    depends_on:
      - cadvisor
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/app.alloy
    volumes:
      - ./observability/alloy/app.alloy:/etc/alloy/app.alloy:ro
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  alloy_data:
