# Merge only — never start this file by itself:
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Starting prod compose without this file silently drops Alloy.

services:
  # cAdvisor fails on Ubuntu 24.04 Docker (overlay layerdb mount-id). This sidecar
  # reads cgroup memory.current via docker.sock and writes a Prometheus textfile.
  container-metrics:
    image: docker:27-cli
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ./observability/scripts/docker-container-memory-textfile.sh:/script.sh:ro
      - textfile_data:/textfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do sh /script.sh; sleep 60; done"

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    env_file: .env
    mem_limit: 512m
    depends_on:
      - container-metrics
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/app.alloy
    volumes:
      - ./observability/alloy/app.alloy:/etc/alloy/app.alloy:ro
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - textfile_data:/textfile:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  alloy_data:
  textfile_data:
