[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "event-vision-pipeline"
version = "0.1.0"
description = "AI-powered event photo delivery platform — backend API, ML pipeline, and async workers."
requires-python = ">=3.10,<3.11"
readme = "README.md"


dependencies = [
    # Web framework
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",

    # Validation & settings
    "pydantic[email]>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",

    # Cache & broker
    "redis>=5.0,<6.0",
    "celery[redis]>=5.3,<6.0",

    # Logging & monitoring
    "structlog>=24.0",
    "sentry-sdk[fastapi]>=2.0",

    # AWS
    "boto3>=1.34",
    "aioboto3>=13.0",

    # Image processing
    "pillow>=10.0",
    "pillow-heif>=0.16",

    # HTTP client
    "httpx>=0.27",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # ML dependencies (loaded only by Celery workers, not API processes)
    "numpy>=1.24,<2.0",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
    "torch>=2.1",
    "tflite-runtime>=2.14; platform_machine != 'arm64'",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "respx>=0.21",
    "pytest-mock>=3.14",
]



# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 99
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "UP007",  # X | Y union syntax (we use __future__.annotations)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "boto3.*",
    "aioboto3.*",
    "cv2.*",
    "onnxruntime.*",
    "tflite_runtime.*",
    "sklearn.*",
    "sentry_sdk.*",
    "pillow_heif.*",
    "app.ml.detection.*",
    "app.ml.embedding.*",
    "app.ml.quality.blur_detector",
    "app.ml.quality.pose_estimator",
    "app.ml.clustering.*",
    "app.ml.matching.*",
    "app.ml.liveness.*",
    "app.services.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
