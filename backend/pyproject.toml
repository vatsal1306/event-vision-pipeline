[project]
name = "spotme-backend"
version = "0.1.0"
description = "AI photo sharing platform API"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.0.1,<4.1",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "redis>=5.2,<6",
    "sentry-sdk[fastapi]>=2.19,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "asyncpg>=0.30,<1",
    "pgvector>=0.3,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
    "types-passlib>=1.7,<2",
    "types-python-jose>=3.3,<4",
]
ml = [
    # Pin torch to pix-workers production versions (Python 3.10 compatible).
    "torch==2.6.0",
    "torchvision==0.21.0",
    "onnxruntime>=1.20.1,<2",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "scikit-learn>=1.3,<2",
    "scikit-image>=0.24,<1",
    "pillow>=11,<12",
    "tensorflow>=2.16,<3",
    "omegaconf>=2.3,<3",
    "transformers>=4.51,<5",
    # glasses-detector requires Python 3.12+ — added in ML-003 when sunglasses module ships
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "sentry_sdk.*",
    "pgvector.*",
    "torch",
    "torch.*",
    "torchvision",
    "torchvision.*",
    "onnxruntime",
    "onnxruntime.*",
    "tensorflow",
    "tensorflow.*",
    "cv2",
    "sklearn",
    "sklearn.*",
    "skimage",
    "skimage.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/ml/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[dependency-groups]
dev = [
    "types-passlib>=1.7.7.20260211",
    "types-python-jose>=3.5.0.20260408",
]
