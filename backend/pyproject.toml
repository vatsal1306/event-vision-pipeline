[project]
name = "spotme-backend"
version = "0.1.0"
description = "AI photo sharing platform API"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.0.1,<4.1",
    "pydantic-settings>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.9,<1",
    "redis>=5.2,<6",
    "sentry-sdk[fastapi]>=2.19,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "asyncpg>=0.30,<1",
    "pgvector>=0.3,<1",
    "uvicorn[standard]>=0.32,<1",
    "boto3>=1.40.61",
    "aioboto3>=15.5.0",
    "blurhash-python>=1.2.2",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "numpy>=2.2.6",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
    "types-passlib>=1.7,<2",
    "types-python-jose>=3.3,<4",
    "types-PyYAML>=6.0,<7",
]
ml = [
    # Pin torch to pix-workers production versions (Python 3.10 compatible).
    "torch==2.6.0",
    "torchvision==0.21.0",
    "onnxruntime>=1.20.1,<2",
    "scikit-learn>=1.3,<2",
    "scikit-image>=0.24,<1",
    "ai-edge-litert>=2.1,<3",
    "omegaconf>=2.3,<3",
    "transformers>=4.51,<5",
    # numpy, pillow, opencv-python-headless are base deps (from main merge).
    # glasses-detector requires Python 3.12+ — added in ML-003 when sunglasses module ships
    "timm>=1.0.29",
    "easydict>=1.13",
    "safetensors>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["models", "app/ml/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]
exclude = ["app/ml/vendor/"]

[[tool.mypy.overrides]]
module = [
    "app.ml",
    "app.ml.*",
]
disallow_untyped_calls = false
disable_error_code = ["type-arg", "call-overload"]

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "sentry_sdk.*",
    "pgvector.*",
    "aioboto3",
    "aioboto3.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "torch",
    "torch.*",
    "torchvision",
    "torchvision.*",
    "onnxruntime",
    "onnxruntime.*",
    "ai_edge_litert",
    "ai_edge_litert.*",
    "glasses_detector",
    "glasses_detector.*",
    "cv2",
    "sklearn",
    "sklearn.*",
    "skimage",
    "skimage.*",
    "transformers",
    "transformers.*",
    "omegaconf",
    "omegaconf.*",
    "safetensors",
    "safetensors.*",
    "timm",
    "timm.*",
    "easydict",
    "easydict.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
markers = [
    "ml: tests that require the ml optional extra (torch, onnxruntime, litert, transformers, model weights)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/ml/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.37.1",
    "moto[s3]>=5.2.3",
    "respx>=0.23.1",
    "types-passlib>=1.7.7.20260211",
    "types-python-jose>=3.5.0.20260408",
]
