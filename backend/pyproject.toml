[project]
name = "spotme-backend"
version = "0.1.0"
description = "AI photo sharing platform API"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<6",
    "sentry-sdk[fastapi]>=2.19,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "asyncpg>=0.30,<1",
    "pgvector>=0.3,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "sentry_sdk.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/ml/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
