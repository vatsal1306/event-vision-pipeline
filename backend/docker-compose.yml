services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: photoshare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d photoshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/photoshare
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  tusd:
    image: tusproject/tusd:v2.5.0
    env_file: .env
    ports:
      - "1080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - -host=0.0.0.0
      - -port=8080
      - -s3-bucket=${S3_BUCKET_ORIGINALS}
      - -s3-endpoint=https://s3.ap-south-1.amazonaws.com
      - -s3-object-prefix=originals/
      - -s3-part-size=5242880
      - -hooks-http=http://host.docker.internal:8000/api/v1/upload/hook
      - -hooks-enabled-events=pre-create,post-finish,post-terminate
      - -hooks-http-retry=3
      - -base-path=/files/
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}

  celery-worker:
    build: .
    env_file: .env
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app", "worker", "-Q", "photo_processing", "--loglevel=info"]
    # Face/ML worker is NOT this service. Run locally:
    #   uv run celery -A app.tasks.celery_app worker -Q face_processing -c 1
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/photoshare
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    env_file: .env
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/photoshare
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
