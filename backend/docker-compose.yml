services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: photoshare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d photoshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/photoshare
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  tusd:
    image: tusnetwork/tusd:latest
    ports:
      - "1080:1080"
    command: >
      -dir /data
      -hooks-http http://backend:8000/api/v1/upload/hook
      -hooks-enabled-events pre-create,post-finish
      -max-size 52428800
      -behind-proxy
    volumes:
      - tusd-data:/data
    depends_on:
      - backend

  celery-worker:
    build: .
    env_file: .env
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app", "worker", "-Q", "photo_processing", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/photoshare
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  tusd-data:
