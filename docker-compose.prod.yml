# Production stack for ~/event-vision-pipeline on the app EC2.
# Usage (from repo root):
#   cp .env.prod.example .env   # fill in secrets
#   chmod 600 .env
#   docker compose -f docker-compose.prod.yml up -d --build

services:
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - frontend
            - backend
            - tusd

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
                NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
                NEXT_PUBLIC_MOCK_API: ${NEXT_PUBLIC_MOCK_API:-false}
                NEXT_PUBLIC_TUS_ENDPOINT: ${NEXT_PUBLIC_TUS_ENDPOINT}
        restart: unless-stopped
        env_file: .env
        environment:
            NODE_ENV: production

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            args:
                INSTALL_ML: "true"
        restart: unless-stopped
        env_file: .env
        # One worker so R100/AdaFace load once for guest selfie (CPU, no CUDA).
        command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
        environment:
            DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/photoshare
            REDIS_URL: redis://redis:6379/0
            CELERY_BROKER_URL: redis://redis:6379/1
            CELERY_RESULT_BACKEND: redis://redis:6379/2
            ML_DEVICE: cpu
            RUN_MIGRATIONS: "true"
        volumes:
            - ./backend/models:/app/models:ro
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    tusd:
        image: tusproject/tusd:v2.5.0
        restart: unless-stopped
        env_file: .env
        environment:
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_REGION: ${AWS_REGION}
        command:
            - -host=0.0.0.0
            - -port=8080
            - -s3-bucket=${S3_BUCKET_ORIGINALS}
            - -s3-endpoint=https://s3.ap-south-1.amazonaws.com
            - -s3-object-prefix=originals/
            - -s3-part-size=5242880
            - -hooks-http=http://backend:8000/api/v1/upload/hook
            - -hooks-enabled-events=post-finish,post-terminate
            - -hooks-http-retry=3
            - -behind-proxy
            - -base-path=/files/
        ulimits:
            nofile:
                soft: 65535
                hard: 65535
        depends_on:
            - backend

    celery-worker:
        build:
            context: ./backend
            dockerfile: Dockerfile
            # INSTALL_ML defaults false — proxies only; do not load R100 here.
        restart: unless-stopped
        env_file: .env
        command:
            - celery
            - -A
            - app.tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
            - -Q
            - photo_processing,notifications
        environment:
            DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/photoshare
            REDIS_URL: redis://redis:6379/0
            CELERY_BROKER_URL: redis://redis:6379/1
            CELERY_RESULT_BACKEND: redis://redis:6379/2
        depends_on:
            redis:
                condition: service_healthy
            backend:
                condition: service_started

    db:
        image: pgvector/pgvector:pg16
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: photoshare
        volumes:
            - pgdata:/var/lib/postgresql/data
        # GPU host connects via the app private IP. Restrict 5432 in
        # platform-app-sg to platform-ml-gpu-sg only — never 0.0.0.0/0.
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d photoshare" ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # Remote GPU worker needs this; protected-mode would reject it without a
        # password. The security group (not Redis) blocks the public internet.
        command: ["redis-server", "--protected-mode", "no"]
        ports:
            - "6379:6379"
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 3s
            retries: 10

    celery-beat:
        build:
            context: ./backend
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file: .env
        command:
            - celery
            - -A
            - app.tasks.celery_app
            - beat
            - --loglevel=info
            - --schedule
            - /tmp/celerybeat-schedule
            - --pidfile
            - /tmp/celerybeat.pid
        environment:
            DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/photoshare
            REDIS_URL: redis://redis:6379/0
            CELERY_BROKER_URL: redis://redis:6379/1
            CELERY_RESULT_BACKEND: redis://redis:6379/2
        depends_on:
            redis:
                condition: service_healthy
            db:
                condition: service_healthy

volumes:
    pgdata:
    caddy_data:
    caddy_config:
